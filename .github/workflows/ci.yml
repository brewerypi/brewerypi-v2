name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # One Windows job: platform breakage (missing system tz database,
        # path and line-ending handling) is an OS-level question, not a
        # per-version one, so a single job covers it. Without this the
        # matrix only ever asks "does it work on Linux?" -- which is how
        # the package stayed broken on Windows behind a green checkmark.
        include:
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tools
        run: pip install -e ".[dev,mcp]"

      - name: Lint with ruff (PEP 8)
        run: ruff check .

      - name: Run tests
        run: pytest
